name: chatify

services:
  postgres:
    restart: always
    image: postgres:16.8-alpine3.20
    container_name: chatify-postgres
    environment:
      POSTGRES_DB: chatify
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_user
      - db_password
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  rabbitmq:
    restart: always
    image: rabbitmq:3.13.7-management-alpine
    container_name: chatify-rabbitmq
    environment:
      # Keep broker credentials in local secret files, matching the existing
      # PostgreSQL setup. These files must not be committed to the repository.
      RABBITMQ_DEFAULT_USER_FILE: /run/secrets/rabbitmq_user
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    networks:
      - backend_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatify-backend
    env_file: "./backend/.envrc"
    environment:
      APP_ENV: production
      # The backend reaches RabbitMQ through the private Compose network. Set
      # this in the deployment environment with the same credentials as the
      # rabbitmq service, for example amqp://user:password@rabbitmq:5672/.
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL}
      RABBITMQ_EVENTS_EXCHANGE: ${RABBITMQ_EVENTS_EXCHANGE:-chatify.events}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      # Offline notifications remain opt-in. When enabled, the three VAPID
      # values must be provided by the deployment secret manager or shell.
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-false}
      NOTIFICATION_CONSUMER_QUEUE: ${NOTIFICATION_CONSUMER_QUEUE:-chatify.notifications}
      NOTIFICATION_POLL_INTERVAL_SECONDS: ${NOTIFICATION_POLL_INTERVAL_SECONDS:-1}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-50}
      NOTIFICATION_RETRY_LIMIT: ${NOTIFICATION_RETRY_LIMIT:-5}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
    networks:
      - backend_network
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "127.0.0.1:8084:8084"

  frontend:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # This is a public Web Push key and must be available while Next.js
        # inlines NEXT_PUBLIC_* values into the browser bundle.
        NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY:-}
    container_name: chatify-frontend
    env_file: "./frontend/.env.local"
    depends_on:
      - postgres
      - backend
    ports:
      - "3000:3000"

secrets:
  db_user:
    file: db_user.txt
  db_password:
    file: db_password.txt
  rabbitmq_user:
    file: rabbitmq_user.txt
  rabbitmq_password:
    file: rabbitmq_password.txt

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  backend_network:
    driver: bridge
